name: release

# on a published github release: build the sdist and the wheel and attach them to it.
# nothing is uploaded to pypi; `pipx install git+https://github.com/alinaschanz/bigmoves` is the way in.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet build
      - run: python -m build
      - run: python -m pip install --quiet dist/*.whl && bigmoves --version
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
