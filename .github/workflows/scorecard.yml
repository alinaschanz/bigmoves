name: scorecard

# openssf scorecard: an automated look at how this repository is run (pinned dependencies,
# branch protection, signed releases, token permissions, ...). the results go to the public
# scorecard api; the badge in the readme reads them from there. weekly, and on every push to main.

on:
  branch_protection_rule:
  schedule:
    - cron: "31 6 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
